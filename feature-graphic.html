<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>UNIUN — Play Store Feature Graphic</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #05070b;
    --muted: #5b6b80;
    --blue: #0075f2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }

  /* Google Play feature graphic = exactly 1024 x 500 px */
  .graphic {
    position: relative;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #ffffff;
    color: var(--ink);
  }

  /* faint connecting network line behind the icons */
  .net {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  .frame {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 44px 64px 48px;
  }

  /* wordmark */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 18px 2px rgba(0,117,242,0.35);
  }
  .brand .name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.42em;
    padding-left: 2px;
    color: var(--blue);
  }
  .brand .tag {
    margin-left: 16px;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* three pillars */
  .pillars {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: center;
    gap: 28px;
    padding-top: 6px;
  }

  .pillar {
    text-align: center;
    padding: 0 14px;
  }

  .icon-wrap {
    height: 132px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 20px;
  }
  .icon-wrap svg {
    height: 120px;
    width: auto;
    filter: drop-shadow(0 8px 22px rgba(0,117,242,0.14));
  }
  /* source icons are black — keep them black on the white background */
  .icon-wrap svg .s0 { fill: #05070b; }

  .pillar .deity {
    font-size: 13px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .pillar .action {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }
  .pillar .line {
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 250px;
    margin: 0 auto;
  }

  /* thin divider rails between pillars */
  .pillar:not(:last-child) { position: relative; }
  .pillar:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 22%;
    right: -14px;
    height: 56%;
    width: 1px;
    background: linear-gradient(transparent, rgba(5,7,11,0.12), transparent);
  }
</style>
</head>
<body>
